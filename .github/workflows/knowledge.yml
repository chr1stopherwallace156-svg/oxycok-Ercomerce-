name: Knowledge foundation

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "docs/knowledge_transfer/**"
      - "docs/rea/**"
      - "docs/elektron_transfer/**"
      - "reconstruction/**"
      - "scripts/knowledge/**"
      - "scripts/transfer/**"
      - "scripts/oxycok.py"
      - "scripts/mission/**"
      - "scripts/elektron_bridge/**"
      - "scripts/reconstruction/**"
      - "web/rea-intake/**"
      - "tests/knowledge/**"
      - "tests/transfer/**"
      - "tests/mission/**"
      - "tests/elektron_bridge/**"
      - "tests/reconstruction/**"
      - ".github/workflows/knowledge.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "docs/knowledge_transfer/**"
      - "docs/rea/**"
      - "docs/elektron_transfer/**"
      - "reconstruction/**"
      - "scripts/knowledge/**"
      - "scripts/transfer/**"
      - "scripts/oxycok.py"
      - "scripts/mission/**"
      - "scripts/elektron_bridge/**"
      - "scripts/reconstruction/**"
      - "web/rea-intake/**"
      - "tests/knowledge/**"
      - "tests/transfer/**"
      - "tests/mission/**"
      - "tests/elektron_bridge/**"
      - "tests/reconstruction/**"
      - ".github/workflows/knowledge.yml"

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/knowledge/knowledge.py validate
      - run: python3 -m unittest discover -s tests/knowledge -v
      - run: python3 -m unittest discover -s tests/transfer -v
      - run: python3 -m unittest discover -s tests/mission -v
      - run: python3 -m unittest discover -s tests/reconstruction -v
      - run: python3 -m unittest discover -s tests/elektron_bridge -v
